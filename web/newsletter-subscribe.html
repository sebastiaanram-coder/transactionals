<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helloprint &middot; 10% off your first order</title>
<meta name="robots" content="noindex">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --color-primary:#008539; --color-primary-dark:#006B2D;
  --color-ink:#191919; --color-ink-muted:#333333; --color-ink-faint:#555555;
  --color-surface:#ffffff; --color-surface-muted:#f8f8f8; --color-border:#e5e5e5;
  --color-upsell-bg:#e8f5e9; --color-trustpilot:#00b67a;
  --radius-card:12px; --radius-card-lg:16px; --radius-pill:9999px;
  --input-border:#d9d9d9;
  --shadow-card:0 1px 2px 0 rgb(0 0 0 / 0.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-surface-muted);color:var(--color-ink);
     font-family:var(--font-sans);font-size:16px;line-height:26px;-webkit-font-smoothing:antialiased}
.top{background:var(--color-surface);border-bottom:1px solid var(--color-border);
     padding:14px 24px;display:flex;align-items:center;gap:16px}
.top svg{height:26px;width:auto}
.langwrap{margin-left:auto;position:relative}
select.lang{font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--color-ink-muted);
     background:var(--color-surface);border:1px solid var(--input-border);border-radius:0.5rem;
     padding:0.5rem 0.75rem;cursor:pointer}
.wrap{max-width:620px;margin:0 auto;padding:40px 24px 56px}
.card{background:var(--color-surface);border:1px solid var(--color-border);
      border-radius:var(--radius-card-lg);box-shadow:var(--shadow-card);padding:36px 34px 30px;text-align:center}
h1{margin:0 0 12px;font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0 auto;max-width:470px;font-size:16px;line-height:26px;color:var(--color-ink-faint)}
form{margin:26px 0 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
input[type=email]{flex:1 1 260px;min-width:0;font-family:var(--font-sans);font-size:16px;line-height:26px;
      color:var(--color-ink);background:var(--color-surface);border:1px solid var(--input-border);
      border-radius:0.5rem;padding:0.75rem 0.9rem}
input[type=email]:focus{outline:2px solid var(--color-primary);outline-offset:1px;border-color:var(--color-primary)}
button{font-family:var(--font-sans);font-size:16px;line-height:21px;font-weight:700;color:#fff;
      background:var(--color-primary);border:0;border-radius:var(--radius-pill);padding:14px 26px;cursor:pointer}
button:hover{background:var(--color-primary-dark)}
button[disabled]{opacity:.55;cursor:default}
.small{margin:14px 0 0;font-size:12px;line-height:18px;color:var(--color-ink-faint)}
.bullets{margin:28px 0 0;padding:22px 0 0;border-top:1px solid var(--color-border);text-align:left}
.b{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:14px;line-height:20px;color:var(--color-ink-muted)}
.b:last-child{margin-bottom:0}
.b svg{flex:none;margin-top:2px}
.tp{margin:24px 0 0;padding:16px 0 0;border-top:1px solid var(--color-border);
    display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;line-height:20px}
.tp .stars{display:inline-flex;gap:2px}
.tp .stars span{width:19px;height:19px;background:var(--color-trustpilot);display:inline-flex;
    align-items:center;justify-content:center}
.tp .stars svg{width:13px;height:13px;fill:#fff}
.tp b{font-weight:700}
.tp .muted{color:var(--color-ink-faint)}
.ok{display:none;text-align:center}
.ok h2{margin:14px 0 8px;font-size:28px;line-height:36px;font-weight:700}
.ok p{margin:0;color:var(--color-ink-faint)}
.err{display:none;margin:14px 0 0;font-size:14px;line-height:20px;color:#d32f2f}
.foot{margin:22px auto 0;max-width:470px;text-align:center;font-size:12px;line-height:18px;color:var(--color-ink-faint)}
@media (max-width:560px){
  h1{font-size:28px;line-height:36px}
  .card{padding:28px 20px 24px}
  form{flex-direction:column}
  button{width:100%}
}
</style>
</head>

function pickLocale(){
  var m = location.pathname.match(/\/([a-z]{2}-[a-z]{2})(\/|$)/i);
  if (m) { var c = m[1].toLowerCase().replace(/-(\w\w)/, function(_,x){return "-"+x.toUpperCase()});
           if (COPY[c]) return c; }
  var q = new URLSearchParams(location.search).get("lang");
  if (q && COPY[q]) return q;
  var n = (navigator.language || "en-GB");
  if (COPY[n]) return n;
  for (var k in COPY) if (k.slice(0,2) === n.slice(0,2)) return k;
  return "en-GB";
}

function apply(loc){
  var c = COPY[loc];
  document.documentElement.lang = loc;
  var set = function(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; };
  set("t-h1", c.h1); set("t-sub", c.sub); set("submit", c.cta);
  set("t-small", c.small); set("t-b1", c.b1); set("t-b2", c.b2); set("t-b3", c.b3);
  set("t-tp", c.tp); set("t-okt", c.okt); set("t-okb", c.okb); set("t-err", c.err);
  document.getElementById("email").placeholder = c.ph;
  document.getElementById("lang").value = loc;
}

var sel = document.getElementById("lang");
Object.keys(COPY).forEach(function(k){
  var o = document.createElement("option");
  o.value = k; o.textContent = COPY[k].name; sel.appendChild(o);
});
var current = pickLocale();
apply(current);
sel.addEventListener("change", function(){ current = sel.value; apply(current); });

document.getElementById("f").addEventListener("submit", function(ev){
  ev.preventDefault();
  var email = document.getElementById("email").value.trim();
  var err = document.getElementById("t-err");
  var btn = document.getElementById("submit");
  err.style.display = "none";
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.style.display = "block"; return; }
  btn.disabled = true;
  fetch("https://a.klaviyo.com/client/subscriptions/?company_id=" + COMPANY_ID, {
    method: "POST",
    headers: { "revision": "2024-10-15", "content-type": "application/json" },

      document.getElementById("bullets").style.display = "none";
      document.getElementById("ok-view").style.display = "block";

});
